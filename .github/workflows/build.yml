name: Build PS4Debug-NG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm cmake python3 ninja-build binutils

      - name: Fix OS check in build.sh safely
        run: |
          # Verwijder alleen de foutmelding en exit over de Ubuntu-versie
          sed -i '/must be built in WSL/d' build.sh
          sed -i '/found ubuntu/d' build.sh
          sed -i 's/exit 1//g' build.sh

      - name: Run original build.sh and keep ELF/bin
        run: |
          chmod +x build.sh
          ./build.sh
          mkdir -p output
          find . -maxdepth 3 \( -name "*.bin" -o -name "*.elf" \) -exec cp {} output/ \;
          ls -lh output/

      - name: Upload gecompileerde bestanden
        uses: actions/upload-artifact@v4
        with:
          name: ps4debug-ng-1400-files
          path: output/*
