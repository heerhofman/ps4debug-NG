name: Build PS4Debug-NG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm python3 binutils cmake ninja-build

      - name: Run build script and locate files
        run: |
          chmod +x build.sh
          ./build.sh || python3 build.py || make || true

      - name: Force copy all build results
        run: |
          mkdir -p output
          # Zoek naar alle .elf en .bin bestanden en kopieer ze direct naar output
          find . -type f \( -name "*.elf" -o -name "*.bin" \) ! -path "./.git/*" -exec cp {} output/ \;
          ls -lh output/

      - name: Upload gecompileerde bestanden
        uses: actions/upload-artifact@v4
        with:
          name: ps4debug-ng-1400-files
          path: output/*
