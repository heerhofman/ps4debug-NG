name: Build PS4Debug-NG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm python3 binutils

      - name: Build using original build script or python
        run: |
          python3 -m pip install --upgrade pip || true
          # Voer de build uit en zoek direct naar gegenereerde bestanden
          ./build.sh || python3 -c "import os; os.system('make')" || true
          
      - name: Collect all compiled binaries and ELFs
        run: |
          mkdir -p output
          find . -type f \( -name "*.bin" -o -name "*.elf" \) -exec cp {} output/ \;
          ls -lh output/

      - name: Upload gecompileerde bestanden
        uses: actions/upload-artifact@v4
        with:
          name: ps4debug-ng-1400-files
          path: output/*
