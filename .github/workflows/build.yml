name: Build PS4Debug-NG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm cmake python3 ninja-build binutils

      - name: Overwrite build.sh cleanly
        run: |
          cat << 'EOF' > build.sh
          #!/usr/bin/env bash
          set -e
          echo "Building ps4debug-ng..."
          mkdir -p build
          cd build
          cmake .. -G Ninja
          ninja
          cd ..
          echo "Build finished successfully."
          EOF
          chmod +x build.sh

      - name: Run build.sh and keep ELF
        run: |
          ./build.sh
          mkdir -p output
          find . -maxdepth 3 \( -name "*.bin" -o -name "*.elf" \) -exec cp {} output/ \;
          ls -lh output/

      - name: Upload gecompileerde bestanden
        uses: actions/upload-artifact@v4
        with:
          name: ps4debug-ng-1400-files
          path: output/*
