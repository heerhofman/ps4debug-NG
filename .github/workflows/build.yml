name: Build PS4Debug-NG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm cmake python3 ninja-build binutils

      - name: Direct CMake Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Collect ELF and bin files
        run: |
          mkdir -p output
          find . -type f \( -name "*.bin" -o -name "*.elf" \) -exec cp {} output/ \;
          ls -lh output/

      - name: Upload gecompileerde bestanden
        uses: actions/upload-artifact@v4
        with:
          name: ps4debug-ng-1400-files
          path: output/*
