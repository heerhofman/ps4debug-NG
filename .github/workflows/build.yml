name: Build PS4Debug-NG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install toolchain
        runs-on: ubuntu-24.04
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm cmake python3 ninja-build binutils

      - name: Force Build via Makefile/CMake
        run: |
          # Als er een hoofd-Makefile is, gebruiken we die, anders CMake in de juiste map
          if [ -f "Makefile" ]; then
            make
          elif [ -f "CMakeLists.txt" ];++
            mkdir -p build && cd build && cmake .. && make
          else
            # Zoek waar de CMakeLists.txt zich bevindt
            DIR=$(find . -name "CMakeLists.txt" -maxdepth 2 -exec dirname {} \; | head -n 1)
            echo "Found CMakeLists in: $DIR"
            cd "$DIR"
            mkdir -p build && cd build
            cmake ..
            make
          fi
        continue-on-error: true

      - name: Fallback Build via python/script als make faalt
        run: |
          # Zoek en kopieer alles wat op een gecompileerd bestand lijkt of bouw handmatig
          find . -name "*.bin" -o -name "*.elf"
          
      - name: Collect all compiled binaries and ELFs
        run: |
          mkdir -p output
          find . -type f \( -name "*.bin" -o -name "*.elf" \) -exec cp {} output/ \;
          ls -lh output/

      - name: Upload gecompileerde bestanden
        uses: actions/upload-artifact@v4
        with:
          name: ps4debug-ng-1400-files
          path: output/*
