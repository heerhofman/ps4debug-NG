name: Build PS4Debug-NG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm cmake python3 ninja-build binutils

      - name: Patch build.sh to bypass OS check
        run: |
          sed -i 's/exit 1//g' build.sh
          sed -i 's/ERROR: ps4debug-NG must be built.*/echo "Bypassing OS check..."/g' build.sh

      - name: Run build.sh and keep ELF
        run: |
          chmod +x build.sh
          ./build.sh
          mkdir -p output
          find . -maxdepth 3 \( -name "*.bin" -o -name "*.elf" \) -exec cp {} output/ \;
          ls -lh output/

      - name: Upload gecompileerde bestanden
        uses: actions/upload-artifact@v4
        with:
          name: ps4debug-ng-1400-files
          path: output/*
